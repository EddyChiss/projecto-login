<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo/geral.css" media="screen">
    <link rel="stylesheet" href="estilo/media-query.css">
    <link rel="shortcut icon" href="imagens/favicon.ico" type="image/x-icon">
    <title>Login</title>
</head>
<body>
    <main>
        <article id="imagem">
            
        </article>
        <article id="principal">
            <h1>Login</h1>
            <p>
                Olá, seja bem-vindo ao site de login!
            </p>
            <form autocomplete="off">
                <div class="campo">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" name="nome" placeholder=" ">
                </div>

                <div class="campo">
                    <label for="senha">Palavra passe</label>
                    <input type="password" name="senha" id="senha" placeholder=" ">
                </div>

                <div id="campo2">
                    <label for="mostrar">Mostrar senha</label>
                    <input type="checkbox" name="mostrar" id="mostrar" onclick="mostrar_senha()">
                </div>

                <button type="submit">Login</button>
            </form>
        </article>
    </main>
    <script src="script/auto.js"></script>
</body>
</html>
